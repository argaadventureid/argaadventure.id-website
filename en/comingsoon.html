<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Arga Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #112a1d;
            color: #ffffff;
        }

        .coming-soon-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(rgba(17, 42, 29, 0.9), rgba(17, 42, 29, 0.95)), 
                        url('../images/banner.jpeg') no-repeat center center/cover;
        }

        .logo-wrapper {
            margin-bottom: 1.5rem;
            animation: fadeInDown 1.2s ease-in-out;
        }

        .logo-wrapper img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .coming-soon-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-in-out;
        }

        .coming-soon-content p {
            font-size: 1.1rem;
            color: #d1d5db;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 1.8rem;
            animation: fadeInUp 1.5s ease-in-out;
        }

        .btn-back-destination {
            display: inline-block;
            background-color: #f39c12;
            color: #000000;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: normal;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.7s ease-in-out;
        }

        .btn-back-destination:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <!-- Logo di Tengah -->
        <div class="logo-wrapper">
            <img src="../images/logoarga.png" alt="Arga Adventure Logo">
        </div>
        
        <!-- Teks Informasi -->
        <div class="coming-soon-content">
            <h1>Coming Soon</h1>
            <p>We are preparing the best hiking and adventure experience for you. Stay tuned for updates!</p>
            
            <!-- Tombol Kembali ke Destinasi Lainnya -->
            <a href="index.html#gunung" class="btn-back-destination">← Explore Other Destinations</a>
        </div>
    </div>

</body>
</html>
